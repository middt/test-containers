---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedock-sa
  namespace: testcontainers-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedock-role
  namespace: testcontainers-demo
rules:
  # Core permissions for Kubedock
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete"]
  # Permissions for leader election (namespace locking)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedock-binding
  namespace: testcontainers-demo
subjects:
- kind: ServiceAccount
  name: kubedock-sa
  namespace: testcontainers-demo
roleRef:
  kind: Role
  name: kubedock-role
  apiGroup: rbac.authorization.k8s.io
