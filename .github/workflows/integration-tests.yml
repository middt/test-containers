name: Tests

on:
  pull_request:
    branches:
      - main
      - 'release-*'

concurrency:
  group: tests-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TestContainersDemo.UnitTests/TestContainersDemo.UnitTests.csproj

      - name: Build
        run: dotnet build TestContainersDemo.UnitTests/TestContainersDemo.UnitTests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test TestContainersDemo.UnitTests/TestContainersDemo.UnitTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=unit-test-results.trx"
          --logger "console;verbosity=detailed"
          --results-directory ./test-results

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: ./test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./test-results
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TestContainersDemo.IntegrationTests/TestContainersDemo.IntegrationTests.csproj

      - name: Build
        run: dotnet build TestContainersDemo.IntegrationTests/TestContainersDemo.IntegrationTests.csproj --no-restore --configuration Release

      - name: Run integration tests
        run: >
          dotnet test TestContainersDemo.IntegrationTests/TestContainersDemo.IntegrationTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=integration-test-results.trx"
          --logger "console;verbosity=detailed"
          --results-directory ./test-results

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: ./test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./test-results
          retention-days: 7
